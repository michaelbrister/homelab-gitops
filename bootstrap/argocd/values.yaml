configs:
  cm:
    url: https://argocd.brister.lan

  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.home.mikebrister.com

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

    pathType: Prefix
    paths:
      - /
    tls: true
